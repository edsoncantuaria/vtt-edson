services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vtt
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtt -d vtt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:OAFh5GZ8rTxJqqWLJ5C4J4LnQSUdz1JvkGs98TdL3To=
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vtt
      DB_USERNAME: vtt
      DB_PASSWORD: vtt
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: vtt
      REVERB_APP_KEY: vttlocalkey
      REVERB_APP_SECRET: vttlocalsecret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_SCHEME: http
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan storage:link || true &&
             php artisan serve --host=0.0.0.0 --port=8000"

  reverb:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:OAFh5GZ8rTxJqqWLJ5C4J4LnQSUdz1JvkGs98TdL3To=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vtt
      DB_USERNAME: vtt
      DB_PASSWORD: vtt
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: vtt
      REVERB_APP_KEY: vttlocalkey
      REVERB_APP_SECRET: vttlocalsecret
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_SCHEME: http
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
    ports:
      - "8080:8080"
    depends_on:
      - api
    command: >
      sh -c "composer install --no-interaction &&
             php artisan reverb:start --host=0.0.0.0 --port=8080"

volumes:
  pgdata:
